apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: fastgpt
spec:
  title: 'FastGPT'
  url: 'https://ai.fastgpt.in/'
  gitRepo: 'https://github.com/labring/FastGPT'
  author: 'Sealos'
  description: 'FastGPT 是一个基于 LLM 大语言模型的知识库问答系统，提供开箱即用的数据处理、模型调用等能力。同时可以通过 Flow 可视化进行工作流编排，从而实现复杂的问答场景！'
  readme: 'https://raw.githubusercontent.com/labring/FastGPT/main/README.md'
  icon: 'https://raw.githubusercontent.com/labring/FastGPT/main/.github/imgs/logo.svg'
  templateType: inline
  locale: zh
  i18n:
    en:
      description: 'A free, open-source, and powerful AI knowledge base platform, offers out-of-the-box data processing, model invocation, RAG retrieval, and visual AI workflows. Easily build complex LLM applications.'
      readme: 'https://raw.githubusercontent.com/labring/FastGPT/main/README_en.md'
  categories:
    - ai
  defaults:
    app_name:
      type: string
      value: fastgpt-${{ random(8) }}
    app_host:
      type: string
      value: ${{ random(8) }}
    session_secret:
      type: string
      value: ${{ random(32) }}
    root_key:
      type: string
      value: ${{ random(32) }}
    aiproxy_key:
      type: string
      value: ${{ random(32) }}
    plugin_token:
      type: string
      value: ${{ random(32) }}
    invoke_token_secret:
      type: string
      value: ${{ random(32) }}
    code_sandbox_token:
      type: string
      value: ${{ random(32) }}
    opensandbox_api_key:
      type: string
      value: ${{ random(32) }}
    agent_sandbox_proxy_secret:
      type: string
      value: ${{ random(32) }}
    volume_manager_auth_token:
      type: string
      value: ${{ random(32) }}
  inputs:
    root_password:
      description: 'root user''s password，username is: root'
      type: string
      default: ''
      required: true

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
    app: ${{ defaults.app_name }}-code-sandbox
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-code-sandbox

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.15.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
    app: ${{ defaults.app_name }}-code-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-code-sandbox
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-code-sandbox
    spec:
      automountServiceAccountToken: false
      containers:
        - name: code-sandbox
          image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: SANDBOX_API_MAX_BODY_MB
              value: '8'
            - name: SANDBOX_MAX_OUTPUT_MB
              value: '10'
            - name: CHECK_INTERNAL_IP
              value: 'false'
            - name: SANDBOX_MAX_TIMEOUT
              value: '60000'
            - name: SANDBOX_MAX_MEMORY_MB
              value: '256'
            - name: SANDBOX_POOL_SIZE
              value: '20'
            - name: SANDBOX_REQUEST_MAX_COUNT
              value: '30'
            - name: SANDBOX_REQUEST_TIMEOUT
              value: '60000'
            - name: SANDBOX_REQUEST_MAX_RESPONSE_MB
              value: '10'
            - name: SANDBOX_REQUEST_MAX_BODY_MB
              value: '5'
            - name: SANDBOX_QUEUE_ID_CONCURRENCY
              value: ''
            - name: LOG_CONSOLE_LEVEL
              value: debug
            - name: LOG_ENABLE_CONSOLE
              value: 'true'
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-code-sandbox
            - name: SANDBOX_JS_ALLOWED_MODULES
              value: lodash,dayjs,moment,uuid,crypto-js,qs,url,querystring
            - name: SANDBOX_PYTHON_ALLOWED_MODULES
              value: math,cmath,decimal,fractions,random,statistics,collections,array,heapq,bisect,queue,copy,itertools,functools,operator,string,re,difflib,textwrap,unicodedata,codecs,datetime,time,calendar,_strptime,json,csv,base64,binascii,struct,hashlib,hmac,secrets,uuid,typing,abc,enum,dataclasses,contextlib,pprint,weakref,numpy,pandas,matplotlib
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.16.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-core-services
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z ${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc 27017; do
                echo "waiting for mongo";
                sleep 2;
              done
              until nc -z ${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc 5432; do
                echo "waiting for postgres";
                sleep 2;
              done
              until nc -z ${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local 6379; do
                echo "waiting for redis";
                sleep 2;
              done
      containers:
        - name: ${{ defaults.app_name }}
          image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.16.1
          env:
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-conn-credential
                  key: password
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-conn-credential
                  key: password
            - name: FE_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: FILE_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DEFAULT_ROOT_PSW
              value: ${{ inputs.root_password }}
            - name: ROOT_KEY
              value: ${{ defaults.root_key }}
            - name: DB_MAX_LINK
              value: '100'
            - name: TOKEN_KEY
              value: ${{ defaults.session_secret }}
            - name: FILE_TOKEN_KEY
              value: filetokenkey
            - name: AES256_SECRET_KEY
              value: fastgptsecret
            - name: INVOKE_TOKEN_SECRET
              value: ${{ defaults.invoke_token_secret }}
            - name: SYNC_INDEX
              value: 'true'
            - name: HOSTNAME
              value: 0.0.0.0
            - name: MULTIPLE_DATA_TO_BASE64
              value: 'true'
            - name: SYSTEM_NAME
              value: FastGPT
            - name: SYSTEM_DESCRIPTION
              value: ''
            - name: SYSTEM_FAVICON
              value: ''
            - name: AIPROXY_API_ENDPOINT
              value: http://${{ defaults.app_name }}-aiproxy.${{ SEALOS_NAMESPACE }}.svc:3000
            - name: AIPROXY_API_TOKEN
              value: ${{ defaults.aiproxy_key }}
            - name: CODE_SANDBOX_URL
              value: http://${{ defaults.app_name }}-code-sandbox.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: CODE_SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: AGENT_SANDBOX_PROVIDER
              value: opensandbox
            - name: AGENT_ENGINE
              value: fastAgent
            - name: AGENT_SANDBOX_PROXY_URL
              value: wss://${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AGENT_SANDBOX_PREVIEW_PROXY_URL
              value: https://${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AGENT_SANDBOX_PROXY_SECRET
              value: ${{ defaults.agent_sandbox_proxy_secret }}
            - name: VM_VOLUME_NAME_PREFIX
              value: fastgpt-session
            - name: AGENT_SANDBOX_OPENSANDBOX_BASEURL
              value: http://${{ defaults.app_name }}-opensandbox-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
            - name: AGENT_SANDBOX_OPENSANDBOX_API_KEY
              value: ${{ defaults.opensandbox_api_key }}
            - name: AGENT_SANDBOX_OPENSANDBOX_RUNTIME
              value: kubernetes
            - name: AGENT_SANDBOX_OPENSANDBOX_USE_SERVER_PROXY
              value: 'true'
            - name: AGENT_SANDBOX_ENABLE_VOLUME
              value: 'true'
            - name: AGENT_SANDBOX_OPENSANDBOX_VOLUME_MANAGER_URL
              value: http://${{ defaults.app_name }}-volume-manager.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: AGENT_SANDBOX_OPENSANDBOX_VOLUME_MANAGER_TOKEN
              value: ${{ defaults.volume_manager_auth_token }}
            - name: AGENT_SANDBOX_OPENSANDBOX_IMAGE
              value: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-agent-sandbox:v0.3.1
            - name: AGENT_SANDBOX_CPU_COUNT
              value: '1'
            - name: AGENT_SANDBOX_MEMORY_MIB
              value: '2048'
            - name: AGENT_SANDBOX_STORAGE_SIZE_GI
              value: '1'
            - name: AGENT_SANDBOX_SUSPEND_MINUTES
              value: '60'
            - name: AGENT_SANDBOX_ARCHIVE_INACTIVE_DAYS
              value: '7'
            - name: AGENT_SANDBOX_NPM_REGISTRY
              value: https://registry.npmmirror.com
            - name: AGENT_SANDBOX_PYPI_INDEX_URL
              value: https://mirrors.aliyun.com/pypi/simple
            - name: PLUGIN_BASE_URL
              value: http://${{ defaults.app_name }}-plugin.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: PLUGIN_TOKEN
              value: ${{ defaults.plugin_token }}
            - name: SSE_MCP_SERVER_PROXY_ENDPOINT
              value: https://${{ defaults.app_host }}-mcp-server.${{ SEALOS_CLOUD_DOMAIN }}
            - name: MARKETPLACE_URL
              value: https://v2.marketplace.fastgpt.cn
            - name: SHOW_COUPON
              value: 'false'
            - name: SHOW_DISCOUNT_COUPON
              value: 'false'
            - name: AGENT_SANDBOX_FREE_TIP
              value: 'false'
            - name: OPENAPI_KEY_MAX_COUNT
              value: '100'
            - name: USE_IP_LIMIT
              value: 'false'
            - name: CHECK_INTERNAL_IP
              value: 'false'
            - name: SERVICE_REQUEST_MAX_CONTENT_LENGTH
              value: '10'
            - name: APP_FOLDER_MAX_AMOUNT
              value: '1000'
            - name: DATASET_FOLDER_MAX_AMOUNT
              value: '1000'
            - name: UPLOAD_FILE_MAX_SIZE
              value: '500'
            - name: UPLOAD_FILE_MAX_AMOUNT
              value: '100'
            - name: PASSWORD_LOGIN_LOCK_SECONDS
              value: ''
            - name: PASSWORD_EXPIRED_MONTH
              value: ''
            - name: MAX_LOGIN_SESSION
              value: ''
            - name: CHAT_MAX_QPM
              value: '5000'
            - name: LLM_REQUEST_TRACKING_RETENTION_HOURS
              value: '6'
            - name: SKIP_FILE_TYPE_CHECK
              value: 'true'
            - name: WECHAT_CHANNEL_CONCURRENCY
              value: '1000'
            - name: WECOM_LOGIN_AUTO_REDIRECT
              value: 'false'
            - name: MAX_HTML_TRANSFORM_CHARS
              value: '1000000'
            - name: STREAM_RESUME_TTL_SECONDS
              value: '300'
            - name: STREAM_RESUME_POST_COMPLETE_TTL_SECONDS
              value: '30'
            - name: STREAM_RESUME_REDIS_MAXMEMORY_RATIO
              value: '0.5'
            - name: STREAM_RESUME_REDIS_MEMORY_CHECK_INTERVAL_MS
              value: '5000'
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-client
            - name: MAX_FOLDER_DEPTH
              value: '4'
            - name: SYSTEM_MAX_STRING_LENGTH_M
              value: '100'
            - name: TRUSTED_PROXY_IPS
              value: ''
            - name: TRUSTED_PROXY_ENABLE
              value: 'false'
            - name: TEXT_TO_CHUNKS_WORKERS
              value: '10'
            - name: HTML_TO_MARKDOWN_WORKERS
              value: '10'
            - name: PARSE_FILE_TIMEOUT_SECONDS
              value: '600'
            - name: PARSE_FILE_WORKERS
              value: '5'
            - name: ALLOWED_ORIGINS
              value: ''

            # 数据库链接
            - name: MONGODB_URI
              value: >-
                mongodb://root:$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc:27017/fastgpt?authSource=admin
            - name: PG_URL
              value: >-
                postgresql://postgres:$(PG_PASSWORD)@${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc:5432/postgres
            - name: REDIS_URL
              value: >-
                redis://default:$(REDIS_PASSWORD)@${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379

            # 对齐 Pro 模板补齐：S3 / MinIO 对象存储配置（直接复用 plugin 的对象存储 Secret）
            - name: STORAGE_VENDOR
              value: minio
            - name: STORAGE_REGION
              value: us-east-1
            - name: STORAGE_S3_ENDPOINT
              value: http://object-storage.objectstorage-system.svc.cluster.local:80
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            - name: STORAGE_S3_MAX_RETRIES
              value: '3'
            - name: STORAGE_DOWNLOAD_URL_MODE
              value: short-proxy
            - name: BACKEND_STORAGE_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: internal
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: accessKey
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: secretKey
            - name: STORAGE_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: bucket
            - name: STORAGE_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: bucket

            - name: LOG_LEVEL
              value: info
            - name: STORE_LOG_LEVEL
              value: warn
            - name: CHAT_FILE_EXPIRE_TIME
              value: 15
            - name: WORKFLOW_MAX_RUN_TIMES
              value: '500'
            - name: WORKFLOW_MAX_LOOP_TIMES
              value: '50'
            - name: WORKFLOW_PARALLEL_MAX_CONCURRENCY
              value: '10'
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          command: []
          args: []
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vn-appvn-datavn-configvn-json
              mountPath: /app/data/config.json
              subPath: ./app/data/config.json
      volumes:
        - name: vn-appvn-datavn-configvn-json
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-appvn-datavn-configvn-json
                path: ./app/data/config.json

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
data:
  vn-appvn-datavn-configvn-json: |
    {
      "feConfigs": {
        "lafEnv": "https://laf.dev" ,
        "mcpServerProxyEndpoint": "http://${{ defaults.app_host }}-mcp-server.${{ SEALOS_CLOUD_DOMAIN }}"
      },
      "systemEnv": {
        "vectorMaxProcess": 15,
        "qaMaxProcess": 15,
        "tokenWorkers": 30,
        "pgHNSWEfSearch": 100
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - port: 3000
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-plugin
  annotations:
    originImageName: ghcr.io/labring/fastgpt-plugin:v1.1.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-plugin
    app: ${{ defaults.app_name }}-plugin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-plugin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-plugin
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z ${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc 27017; do
                echo "waiting for mongo";
                sleep 2;
              done
              until nc -z ${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local 6379; do
                echo "waiting for redis";
                sleep 2;
              done
      containers:
        - name: ${{ defaults.app_name }}-plugin
          image: ghcr.io/labring/fastgpt-plugin:v1.1.1
          env:
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-conn-credential
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-conn-credential
                  key: password
            - name: BACKEND_STORAGE_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: internal
            - name: MINIO_CUSTOM_ENDPOINT
              value: ''
            - name: BACKEND_STORAGE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: secretKey
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: internal
            - name: MINIO_PORT
              value: '80'
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: secretKey
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-plugin
                  key: bucket
            - name: MINIO_USE_SSL
              value: 'false'
            - name: STORAGE_VENDOR
