                  key: password
            - name: ADMIN_KEY
              value: ${{ defaults.aiproxy_key }}
            - name: LOG_DETAIL_STORAGE_HOURS
              value: '1'
            - name: DISABLE_MODEL_CONFIG
              value: 'true'
            - name: LOG_STORAGE_HOURS
              value: '168'
            - name: RETRY_TIMES
              value: '3'
            - name: BILLING_ENABLED
              value: 'false'
            - name: SQL_DSN
              value: >-
                postgresql://postgres:$(PG_PASSWORD)@${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc:5432/postgres
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          ports:
            - containerPort: 3000
              name: ${{ random(12) }}
          imagePullPolicy: Always
          volumeMounts: []
      volumes: []

